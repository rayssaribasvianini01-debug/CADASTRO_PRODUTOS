<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="conteiner">

        <h1>Cadastro de produtos</h1>

        <!-- Formulário de entrada -->
        <form id="produto-form">

            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex. notebook"
                    required
                >
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input
                    type="number"
                    id="preco"
                    step="0.01"
                    placeholder="Ex. 3500,00"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input
                    type="number"
                    id="quantidade"
                    placeholder="Ex. 5"
                    required
                >
            </div>

            <button type="submit" class="btn-primary">
                Adicionar produto
            </button>

        </form>


        <!-- Cabeçalho de ações e resumo -->
        <div class="resumo-conteiner">

            <h3 id="total-estoque">
                Total em estoque: R$ 0,00
            </h3>

            <button id="limpar-tabela" class="btn-danger">
                Limpar tudo
            </button>

        </div>


        <!-- Tabela de exibição -->
        <table id="tabela-produtos">

            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço-Un</th>
                    <th>Quant.</th>
                    <th>Sub-total</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody>
                <!-- As linhas serão inseridas pelo JavaScript -->
            </tbody>

            <tfoot>
            </tfoot>

        </table>

    </div>

    <script src="script.js"></script>

</body>

</html>
